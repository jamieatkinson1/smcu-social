# Copy to wrangler.toml only for local commissioning; production deploys as
# the existing smcu-social Worker.
name = "smcu-social"
main = "worker/index.js"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/communications/api/*", "/assets/communications/*"]

[[d1_databases]]
binding = "PUBLICATIONS_DB"
database_name = "smcu-communications"
database_id = "REPLACE_WITH_EXISTING_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTWORK_BUCKET"
bucket_name = "smcu-communications-artwork"
